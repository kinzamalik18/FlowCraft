# Render blueprint for the FlowCraft API.
# Reads GEMINI_API_KEY from an environment group named "gemini" created in the
# Render dashboard. After the frontend is deployed, set CORS_ORIGINS to its URL.
services:
  - type: web
    name: flowcraft-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: free
    healthCheckPath: /health
    envVars:
      - fromGroup: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
